upstream backend_upstream {
    server backend:8080;
}

upstream ai_upstream {
    server ai-service:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/wealthos.local.crt;
    ssl_certificate_key /etc/nginx/certs/wealthos.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # --- FastAPI-specific routes (must come before generic /api/) ---
    location /api/market/          { proxy_pass http://ai_upstream/api/market/;          include /etc/nginx/proxy_common.conf; }
    location /api/v1/market/       { proxy_pass http://ai_upstream/api/v1/market/;       include /etc/nginx/proxy_common.conf; }
    location /api/assets/          { proxy_pass http://ai_upstream/api/assets/;          include /etc/nginx/proxy_common.conf; }
    location /api/analytics/portfolios/ { proxy_pass http://backend_upstream/api/analytics/portfolios/; include /etc/nginx/proxy_common.conf; }
    location /api/analytics/       { proxy_pass http://ai_upstream/api/analytics/;       include /etc/nginx/proxy_common.conf; }
    location /api/v1/ai/           { proxy_pass http://ai_upstream/api/v1/ai/;           include /etc/nginx/proxy_common.conf; }
    location /api/ai/              { proxy_pass http://ai_upstream/api/ai/;              include /etc/nginx/proxy_common.conf; }
    location /api/integrations/    { proxy_pass http://ai_upstream/api/integrations/;    include /etc/nginx/proxy_common.conf; }
    location /api/v1/integrations/ { proxy_pass http://ai_upstream/api/v1/integrations/; include /etc/nginx/proxy_common.conf; }
    location /api/macro/           { proxy_pass http://ai_upstream/api/macro/;           include /etc/nginx/proxy_common.conf; }
    location /api/v1/macro/        { proxy_pass http://ai_upstream/api/v1/macro/;        include /etc/nginx/proxy_common.conf; }
    location /api/tax/             { proxy_pass http://ai_upstream/api/tax/;             include /etc/nginx/proxy_common.conf; }
    location /api/optimizer/       { proxy_pass http://ai_upstream/api/optimizer/;       include /etc/nginx/proxy_common.conf; }
    location /api/dividends/       { proxy_pass http://ai_upstream/api/dividends/;       include /etc/nginx/proxy_common.conf; }
    location /api/filings/         { proxy_pass http://ai_upstream/api/filings/;         include /etc/nginx/proxy_common.conf; }
    location /ai/                  { proxy_pass http://ai_upstream/;                     include /etc/nginx/proxy_common.conf; }

    location /api/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_common.conf;
    }

    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /swagger-ui/  { proxy_pass http://backend_upstream; proxy_set_header Host $host; }
    location /v3/api-docs/ { proxy_pass http://backend_upstream; proxy_set_header Host $host; }

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/proxy_common.conf;
    }
}